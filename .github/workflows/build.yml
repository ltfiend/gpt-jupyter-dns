name: Build, Test & Publish

# CI/CD for the gpt-jupyter-dns image.
#
#   PR              -> lint + build + smoke test + vuln scan  (no push)
#   push to main    -> the above, then push :latest + sha tag
#   tag  v*         -> the above, then push semver tags
#   weekly schedule -> rebuild to pick up base-image + pip security fixes,
#                      re-scan, and republish :latest (security-tool hygiene)
#   manual dispatch -> same as a main build
#
# GHCR is always a publish target (uses the built-in GITHUB_TOKEN).
# The private registry.devries.tv is published to only when the
# REGISTRY_USERNAME / REGISTRY_PASSWORD secrets are configured.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

# One in-flight run per ref; cancel superseded PR builds but let pushes finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  PRIVATE_IMAGE: registry.devries.tv/gpt-jupyter-dns
  CI_TAG: gpt-jupyter-dns:ci

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    name: Build, smoke-test, scan & publish
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write          # push to GHCR
      security-events: write   # upload Trivy SARIF
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Build once, load into the local daemon for test + scan ----
      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.CI_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (tools + Python libs)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test:/t:ro" \
            --entrypoint bash \
            ${{ env.CI_TAG }} /t/smoke-test.sh

      # ---- Vulnerability scan (report-only; base-image CVEs shouldn't block) ----
      - name: Trivy scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CI_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Trivy scan (human-readable summary)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CI_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # ---- Publish (skipped for PRs) ----
      - name: Detect private-registry credentials
        id: privreg
        run: |
          if [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REGISTRY_PASSWORD not set — skipping push to $PRIVATE_IMAGE"
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to private registry
        if: github.event_name != 'pull_request' && steps.privreg.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: registry.devries.tv
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.PRIVATE_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # Cache is warm from the build-and-load above, so this is a fast re-export.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
