name: Build, Test & Publish

# CI/CD for the gpt-jupyter-dns image.
#
#   PR              -> lint + build + smoke test + vuln scan  (no push)
#   push to main    -> the above, then push :latest + sha tag
#   tag  v*         -> the above, then push semver tags
#   weekly schedule -> rebuild to pick up base-image + pip security fixes,
#                      re-scan, and republish :latest (security-tool hygiene)
#   manual dispatch -> same as a main build
#
# GHCR is always a publish target (uses the built-in GITHUB_TOKEN).
# The private registry.devries.tv is published to only when the
# REGISTRY_USERNAME / REGISTRY_PASSWORD secrets are configured.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

# One in-flight run per ref; cancel superseded PR builds but let pushes finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  PRIVATE_IMAGE: registry.devries.tv/gpt-jupyter-dns
  CI_TAG: gpt-jupyter-dns:ci

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    name: Build, smoke-test, scan & publish
    runs-on: [self-hosted, Linux, X64]
    needs: lint
    permissions:
      contents: read
      packages: write          # push to GHCR
      security-events: write   # upload Trivy SARIF
    steps:
      - uses: actions/checkout@v4

      # Plain `docker build` on the self-hosted box: the daemon's persistent
      # layer cache makes rebuilds fast without shipping cache to/from GitHub.
      # (No buildx needed — this runner only has the classic builder.)
      - name: Build image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --tag "${{ env.CI_TAG }}" \
            --file Dockerfile \
            .

      - name: Smoke test (tools + Python libs)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test:/t:ro" \
            --entrypoint bash \
            ${{ env.CI_TAG }} /t/smoke-test.sh

      - name: dnslab lint (manifests + config templates)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test:/t:ro" \
            -v "${{ github.workspace }}/dnslab:/opt/dnslab/dnslab:ro" \
            -e PYTHONPATH=/opt/dnslab \
            --entrypoint bash \
            ${{ env.CI_TAG }} /t/dnslab-lint.sh

      # ---- Vulnerability scan (report-only; base-image CVEs shouldn't block) ----
      - name: Trivy scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CI_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Trivy scan (human-readable summary)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.CI_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # ---- Publish (skipped for PRs) ----
      - name: Detect private-registry credentials
        id: privreg
        run: |
          if [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REGISTRY_PASSWORD not set — skipping push to $PRIVATE_IMAGE"
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to private registry
        if: github.event_name != 'pull_request' && steps.privreg.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.devries.tv
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.PRIVATE_IMAGE }}
          # Skip the private registry's tags when its creds are absent, so we
          # don't tag/push images we can't authenticate to.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # Re-tag the already-built CI image and push. Tags for registries we
      # didn't log in to are skipped individually (a failed push there would
      # otherwise fail the job).
      - name: Tag & push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PRIVREG_ENABLED: ${{ steps.privreg.outputs.enabled }}
        run: |
          set -euo pipefail
          echo "$TAGS" | while read -r tag; do
            [ -z "$tag" ] && continue
            case "$tag" in
              "${PRIVATE_IMAGE}:"*)
                if [ "$PRIVREG_ENABLED" != "true" ]; then
                  echo "::notice::skipping $tag (no private-registry creds)"
                  continue
                fi
                ;;
            esac
            echo "Pushing $tag"
            docker tag "${CI_TAG}" "$tag"
            docker push "$tag"
          done
